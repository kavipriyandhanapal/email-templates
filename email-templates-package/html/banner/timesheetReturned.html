<body style="margin:0;padding:0;background:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><table width="100%" cellpadding="0" cellspacing="0" style="background:#eef2f7;padding:36px 18px"><tr><td align="center"><table width="100%" cellpadding="0" cellspacing="0" style="max-width:620px;background:#fff;border-radius:14px;overflow:hidden"><tr><td style="padding:32px 38px;background-color:#0891b2;background-image:linear-gradient(120deg,#0891b2 0%,#0f172a 230%)"><div style="margin-bottom:18px"><span style="display:inline-block;background:#fff;border-radius:10px;padding:7px 12px"><img src="{logoUrl}" alt="{organizationName}" height="56" style="display:block;height:56px;width:auto;max-width:180px;border:0;outline:none;"></span></div><div style="color:rgba(255,255,255,.78);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px">{organizationName} · {appName}</div><h1 style="margin:12px 0 0;color:#fff;font-size:27px">Timesheet returned</h1></td></tr><tr><td style="padding:28px 38px 8px"><p style="margin:0 0 18px;color:#475569;font-size:16px;line-height:1.6">Hello <strong>{receiverName}</strong>, your timesheet needs corrections before it can be approved.</p><table width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:12px 0;color:#94a3b8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid #eef2f7">Period</td><td style="padding:12px 0;text-align:right;color:#0f172a;font-size:15px;border-bottom:1px solid #eef2f7">{periodLabel}</td></tr><tr><td style="padding:12px 0;color:#94a3b8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid #eef2f7">Returned by</td><td style="padding:12px 0;text-align:right;color:#0f172a;font-size:15px;border-bottom:1px solid #eef2f7">{supervisorName}</td></tr><tr><td style="padding:12px 0;color:#94a3b8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6p
