<body style="margin:0;padding:0;background-color:#7c3aed;background-image:linear-gradient(135deg,#7c3aed 0%,#1e1b4b 130%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><table width="100%" cellpadding="0" cellspacing="0" style="background-color:#7c3aed;background-image:linear-gradient(135deg,#7c3aed 0%,#1e1b4b 130%);padding:40px 18px"><tr><td align="center"><table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#fff;border-radius:22px;overflow:hidden"><tr><td align="center" style="padding:38px 38px 8px"><img src="{logoUrl}" alt="{organizationName}" height="56" style="display:block;height:56px;width:auto;max-width:180px;border:0;outline:none;margin:0 auto 22px"><div style="width:60px;height:60px;line-height:60px;border-radius:50%;background-color:#7c3aed;background-image:linear-gradient(135deg,#7c3aed,#1e1b4b 220%);color:#fff;font-size:28px;font-weight:700;text-align:center">+</div><div style="margin-top:18px;color:#94a3b8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px">{organizationName} · {appName}</div><h1 style="margin:10px 0 10px;color:#0f172a;font-size:25px">Overtime approved</h1><p style="margin:0;color:#475569;font-size:15px;line-height:1.65">Hello <strong>{receiverName}</strong>, your overtime request was approved. You can now use the pay code on your timesheet.</p></td></tr><tr><td style="padding:18px 38px 6px"><table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;border-radius:14px"><tr><td style="padding:12px 18px;color:#64748b;font-size:13px">Request</td><td style="padding:12px 18px;text-align:right;color:#0f172a;font-weight:600">{requestId}</td></tr><tr><td style="padding:12px 18px;color:#64748b;font-size:13px;border-top:1px solid #e8edf3">Work date</td><td style="padding:12px 18px;text-align:right;color:#0f172a;font-weight:600;border-top:1px solid #e8edf3">{workDate}</td></tr><tr><td style="padding:12px 18px;color:#64748b;font-size:13px;border-top:1px solid #e8edf3">Pay code</td><td style="padding:12px 18px;text-align:right;color:#0f172a;font-weight:600;border-top:1px solid #e8edf3">{payCode}</td></tr><tr><td style="padding:12px 18px;color:#64748b;font-size:13px;border-top:1px solid #e8edf3">Hours</td><td style="padding:12px 18px;text-align:right;color:#0f172a;font-weight:600;border-top:1px solid #e8edf3">{hours}</td></tr></table></td></tr><tr><td align="center" style="padding:22px 38px 36px"><a href="{appUrl}" style="display:inline-block;text-decoration:none;font-weight:700;background-color:#7c3aed;background-image:linear-gradient(135deg,#7c3aed,#1e1b4b 260%);color:#fff;padding:14px 32px;border-radius:99px">Open timesheet</a></td></tr></table><div style="margin-top:18px;color:rgba(255,255,255,.8);font-size:12px">This is an automated Timesheet notification.</div></td></tr></table></body>
