<body style="margin:0;padding:0;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:36px 18px"><tr><td align="center"><table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#fff;border:1px solid #e2e8f0;border-radius:22px;overflow:hidden"><tr><td align="center" style="padding:38px 38px 8px"><img src="{logoUrl}" alt="{organizationName}" height="56" style="display:block;height:56px;width:auto;max-width:180px;border:0;outline:none;margin:0 auto 20px"><div style="width:58px;height:58px;line-height:58px;border-radius:50%;background:#7c3aed1f;color:#7c3aed;font-size:28px;font-weight:700;text-align:center">+</div><div style="margin-top:18px;color:#94a3b8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px">{organizationName} · {appName}</div><h1 style="margin:10px 0 10px;color:#0f172a;font-size:24px">Overtime approved</h1><p style="margin:0;color:#475569;font-size:15px;line-height:1.65">Hello <strong>{receiverName}</strong>, your overtime request was approved. You can now use the pay code on your timesheet.</p></td></tr><tr><td style="padding:20px 38px 6px"><table width="100%" cellpadding="0" cellspacing="0" style="border-top:2px dashed #e2e8f0"><tr><td style="padding:12px 0;color:#64748b;font-size:13px;border-bottom:1px dashed #e2e8f0">Request</td><td style="padding:12px 0;text-align:right;color:#0f172a;font-size:14px;font-weight:600;border-bottom:1px dashed #e2e8f0">{requestId}</td></tr><tr><td style="padding:12px 0;color:#64748b;font-size:13px;border-bottom:1px dashed #e2e8f0">Work date</td><td style="padding:12px 0;text-align:right;color:#0f172a;font-size:14px;font-weight:600;border-bottom:1px dashed #e2e8f0">{workDate}</td></tr><tr><td style="padding:12px 0;color:#64748b;font-size:13px;border-bottom:1px dashed #e2e8f0">Pay code</td><td style="padding:12px 0;text-align:right;color:#0f172a;font-size:14px;font-weight:600;border-bottom:1px dashed #e2e8f0">{payCode}</td></tr><tr><td style="padding:12px 0;color:#64748b;font-size:13px;border-bottom:1px dashed #e2e8f0">Hours</td><td style="padding:12px 0;text-align:right;color:#0f172a;font-size:14px;font-weight:600;border-bottom:1px dashed #e2e8f0">{hours}</td></tr></table></td></tr><tr><td align="center" style="padding:22px 38px 34px"><a href="{appUrl}" style="display:inline-block;text-decoration:none;font-weight:700;background:#7c3aed;color:#fff;padding:14px 32px;border-radius:99px">Open timesheet</a></td></tr><tr><td align="center" style="padding:18px 38px;background:#f8fafc;color:#94a3b8;font-size:12px">This is an automated Timesheet notification.</td></tr></table></td></tr></table></body>
