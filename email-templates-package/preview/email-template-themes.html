<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Email template themes</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--tx:#e2e8f0;--mu:#94a3b8;--bd:#25324a}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--tx:#e2e8f0;--mu:#94a3b8;--bd:#25324a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 14px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);margin:18px 0 8px}
p.s{margin:0;color:var(--mu);font-size:14px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.th{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.th b{display:block;font-size:14px}.th span{font-size:12px;color:var(--mu)}
.th.on{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 28%,transparent)}
.types{display:flex;gap:6px;flex-wrap:wrap}
.ty{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;display:flex;gap:7px;align-items:center}
.ty i{width:9px;height:9px;border-radius:50%}.ty.on{background:var(--ac);border-color:var(--ac);color:#fff}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-top:14px}
.bar{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:13px;color:var(--mu)}
.bar b{color:var(--tx)}
button.b{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
button.b.p{background:var(--ac);border-color:var(--ac);color:#fff}
iframe{width:100%;height:680px;border:0;display:block;background:#fff}
textarea{width:100%;height:320px;border:0;border-top:1px solid var(--bd);background:var(--bg);color:var(--tx);font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px;display:none}
</style></head><body><div class="wrap">
<h1>Email template themes</h1>
<p class="s">Each theme is a different layout. Every theme works for all notification types, so the client picks one and it applies everywhere.</p>
<h2>1. Choose a theme</h2><div class="row" id="themes"></div>
<h2>2. Preview by notification type</h2><div class="types" id="types"></div>
<div class="panel"><div class="bar"><div>Subject: <b id="subj"></b></div>
<div><label style="font-size:12px;margin-right:8px"><input type="checkbox" id="emb"> Embed logo in JSON</label><button class="b" id="tog">Show JSON</button> <button class="b p" id="copy">Copy theme JSON</button></div></div>
<iframe id="fr" title="Email preview"></iframe><textarea id="ta" readonly></textarea></div></div>
<script>
const F="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
const ORG='{organizationName} · {appName}',FOOT='This is an automated Timesheet notification.';
const T=[
{k:'submitted',n:'Submitted',g:'↗',c:'#2563eb',s:'Leave request {requestId} awaiting your approval',t:'New leave request',i:'<strong>{employeeName}</strong> submitted a leave request that needs your review.',r:[['Request','{requestId}'],['Employee','{employeeName}'],['Leave','{leaveType}, {startDate} – {endDate} ({days} day(s))'],['Reason','{reason}']],b:'Review request'},
{k:'approved',n:'Approved',g:'✓',c:'#16a34a',s:'Leave request {requestId} approved',t:'Leave request approved',i:'Hello <strong>{receiverName}</strong>, your leave request has been approved.',r:[['Request','{requestId}'],['Leave','{leaveType}, {startDate} – {endDate} ({days} day(s))'],['Approved by','{supervisorName}']],b:'View leave request'},
{k:'rejected',n:'Rejected',g:'✕',c:'#dc2626',s:'Leave request {requestId} rejected',t:'Leave request rejected',i:'Hello <strong>{receiverName}</strong>, unfortunately your leave request was not approved.',r:[['Request','{requestId}'],['Leave','{leaveType}, {startDate} – {endDate} ({days} day(s))'],['Rejected by','{supervisorName}'],['Reason','{reason}']],b:'View leave request'},
{k:'sendBack',n:'Sent back',g:'↩',c:'#d97706',s:'Leave request {requestId} sent back',t:'Leave request sent back',i:'Hello <strong>{receiverName}</strong>, your leave request was returned for changes. Update it and submit it again.',r:[['Request','{requestId}'],['Leave','{leaveType}, {startDate} – {endDate} ({days} day(s))'],['Supervisor','{supervisorName}'],['Reason','{reason}']],b:'View leave request'},
{k:'cancelled',n:'Cancelled',g:'–',c:'#475569',s:'Leave request {requestId} cancelled',t:'Leave request cancelled',i:'Hello <strong>{receiverName}</strong>, the leave request below has been cancelled.',r:[['Request','{requestId}'],['Leave','{leaveType}, {startDate} – {endDate} ({days} day(s))'],['Cancelled by','{supervisorName}']],b:'View leave request'},
{k:'reminder',n:'Reminder',g:'!',c:'#ea580c',s:'Reminder: leave request {requestId} is still pending',t:'Approval reminder',i:'Hello <strong>{receiverName}</strong>, this request from <strong>{employeeName}</strong> is still waiting for your decision.',r:[['Request','{requestId}'],['Employee','{employeeName}'],['Leave','{leaveType}, {startDate} – {endDate} ({days} day(s))']],b:'Review request'},
{k:'overtimeApproved',n:'Overtime approved',g:'+',c:'#7c3aed',s:'Overtime request {requestId} approved',t:'Overtime approved',i:'Hello <strong>{receiverName}</strong>, your overtime request was approved. You can now use the pay code on your timesheet.',r:[['Request','{requestId}'],['Work date','{workDate}'],['Pay code','{payCode}'],['Hours','{hours}']],b:'Open timesheet'},
{k:'timesheetReturned',n:'Timesheet returned',g:'↩',c:'#0891b2',s:'Timesheet for {periodLabel} returned',t:'Timesheet returned',i:'Hello <strong>{receiverName}</strong>, your timesheet needs corrections before it can be approved.',r:[['Period','{periodLabel}'],['Returned by','{supervisorName}'],['Reason','{reason}']],b:'Open timesheet'}
];
const R=(t,f)=>t.r.map((x,i)=>f(x[0],x[1],i)).join('');
const A=(t,st)=>`<a href="{appUrl}" style="display:inline-block;text-decoration:none;font-weight:700;${st}">${t.b}</a>`;
const shell=(bg,w,inner)=>`<body style="margin:0;padding:0;background:${bg};${F}"><table width="100%" cellpadding="0" cellspacing="0" style="background:${bg};padding:36px 18px"><tr><td align="center"><table width="100%" cellpadding="0" cellspacing="0" style="max-width:${w}px;${inner}`;
const LOGO=st=>`<img src="{logoUrl}" alt="{organizationName}" height="56" style="display:block;height:56px;width:auto;max-width:180px;border:0;outline:none;${st}">`;
const CHIP=`<div style="margin-bottom:18px"><span style="display:inline-block;background:#fff;border-radius:10px;padding:7px 12px">${LOGO('')}</span></div>`;
const shell2=(bg,w,inner)=>`<body style="margin:0;padding:0;${bg};${F}"><table width="100%" cellpadding="0" cellspacing="0" style="${bg};padding:40px 18px"><tr><td align="center"><table width="100%" cellpadding="0" cellspacing="0" style="max-width:${w}px;${inner}`;
const THEMES=[
{id:'aurora',n:'Gradient aurora',d:'Gradient backdrop, floating white card, gradient button',f:t=>shell2(`background-color:${t.c};background-image:linear-gradient(135deg,${t.c} 0%,#1e1b4b 130%)`,600,`background:#fff;border-radius:22px;overflow:hidden"><tr><td align="center" style="padding:38px 38px 8px">${LOGO('margin:0 auto 22px')}<div style="width:60px;height:60px;line-height:60px;border-radius:50%;background-color:${t.c};background-image:linear-gradient(135deg,${t.c},#1e1b4b 220%);color:#fff;font-size:28px;font-weight:700;text-align:center">${t.g}</div><div style="margin-top:18px;color:#94a3b8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px">${ORG}</div><h1 style="margin:10px 0 10px;color:#0f172a;font-size:25px">${t.t}</h1><p style="margin:0;color:#475569;font-size:15px;line-height:1.65">${t.i}</p></td></tr><tr><td style="padding:18px 38px 6px"><table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;border-radius:14px">${R(t,(l,v,i)=>`<tr><td style="padding:12px 18px;color:#64748b;font-size:13px${i?';border-top:1px solid #e8edf3':''}">${l}</td><td style="padding:12px 18px;text-align:right;color:#0f172a;font-weight:600${i?';border-top:1px solid #e8edf3':''}">${v}</td></tr>`)}</table></td></tr><tr><td align="center" style="padding:22px 38px 36px">${A(t,`background-color:${t.c};background-image:linear-gradient(135deg,${t.c},#1e1b4b 260%);color:#fff;padding:14px 32px;border-radius:99px`)}</td></tr></table><div style="margin-top:18px;color:rgba(255,255,255,.8);font-size:12px">${FOOT}</div></td></tr></table></body>`)},
{id:'glass',n:'Gradient glass',d:'Full gradient card, frosted detail panel',f:t=>shell2(`background-color:#0b1020`,600,`background-color:#0f172a;background-image:linear-gradient(145deg,#0f172a 0%,${t.c} 170%);border-radius:22px;overflow:hidden"><tr><td style="padding:36px 38px 12px">${CHIP}<span style="display:inline-block;background:rgba(255,255,255,.16);color:#fff;padding:5px 12px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase">${t.g} ${t.n}</span><div style="margin-top:16px;color:rgba(255,255,255,.6);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px">${ORG}</div><h1 style="margin:8px 0 10px;color:#fff;font-size:26px">${t.t}</h1><p style="margin:0;color:rgba(255,255,255,.82);font-size:15px;line-height:1.65">${t.i}</p></td></tr><tr><td style="padding:14px 38px 6px"><table width="100%" cellpadding="0" cellspacing="0" style="background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:14px">${R(t,(l,v,i)=>`<tr><td style="padding:12px 16px;color:rgba(255,255,255,.65);font-size:13px${i?';border-top:1px solid rgba(255,255,255,.12)':''}">${l}</td><td style="padding:12px 16px;text-align:right;color:#fff${i?';border-top:1px solid rgba(255,255,255,.12)':';font-weight:700'}">${v}</td></tr>`)}</table></td></tr><tr><td style="padding:24px 38px 34px">${A(t,`background:#fff;color:#0f172a;padding:13px 26px;border-radius:10px`)}</td></tr><tr><td style="padding:18px 38px;border-top:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.55);font-size:12px;text-align:center">${FOOT}</td></tr></table></td></tr></table></body>`)},
